# cargo deny: licences and RustSec advisories. sitevet is MIT, so every dependency must allow
# shipping an MIT binary.

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # basic-toml is unmaintained. askama_derive (the decided template engine, stage 4) uses it
    # at compile time to read askama's own config; no page data ever reaches it. Revisit when
    # askama replaces it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, inside askama_derive" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
# MPL-2.0 is file-level copyleft: fine to link unmodified into an MIT binary. Allowed only for
# the crates that need it (scraper's CSS stack, and option-ext under directories). axe-core, the other MPL-2.0 piece, is a bundled
# file, not a crate, and is listed in THIRD_PARTY.md.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
