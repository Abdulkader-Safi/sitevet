# cargo deny: licences and RustSec advisories. sitevet is MIT, so every dependency must allow
# shipping an MIT binary.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
# MPL-2.0 is file-level copyleft: fine to link unmodified into an MIT binary. Allowed only for
# the crates that need it (scraper's CSS stack). axe-core, the other MPL-2.0 piece, is a bundled
# file, not a crate, and is listed in THIRD_PARTY.md.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
