[workspace]
resolver = "3"
members = ["crates/sitevet", "crates/sitevet-cli"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Abdulkader-Safi/sitevet"
authors = ["Abdulkader Safi"]

[workspace.dependencies]
sitevet = { path = "crates/sitevet", version = "0.2.1" }
async-channel = "2.5"
futures = "0.3"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "zstd", "http2", "stream"] }
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
texting_robots = "0.2"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zstd", "zlib"] }
toml = "1.2"
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }
wiremock = "0.6"
chromiumoxide = { version = "0.9", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
zstd = "0.14"
directories = "6"
regex = "1.13"
unicode-segmentation = "1.13"
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
askama = "0.16"
schemars = "1.2"
jsonschema = { version = "0.61", default-features = false }
insta = "1.49"
anstream = "1"
anstyle = "1"
assert_cmd = "2.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[workspace.lints.rust]
# deny, not forbid: one test sets an environment variable (unsafe in edition 2024).
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# Options is #[non_exhaustive], so callers set fields after Default::default().
field_reassign_with_default = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
