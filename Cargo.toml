[workspace]
resolver = "3"
members = ["crates/sitevet", "crates/sitevet-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Abdulkader-Safi/sitevet"
authors = ["Abdulkader Safi"]

[workspace.dependencies]
sitevet = { path = "crates/sitevet", version = "0.0.0" }
async-channel = "2.5"
futures = "0.3"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "zstd", "http2", "stream"] }
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
texting_robots = "0.2"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = "0.7"
toml = "1.2"
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }
wiremock = "0.6"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# Options is #[non_exhaustive], so callers set fields after Default::default().
field_reassign_with_default = "allow"
