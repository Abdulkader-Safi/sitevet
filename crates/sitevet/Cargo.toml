[package]
name = "sitevet"
description = "Website audit engine: crawl a site, run SEO, security and accessibility rules, get a typed, scored report."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["seo", "audit", "accessibility", "crawler", "website"]
categories = ["web-programming", "development-tools"]

[features]
default = []
# Rendered checks in a local Chrome (M4). History (M5) and media (M12) are declared so
# Options::validate can say which feature a setting needs.
browser = ["dep:chromiumoxide"]
history = []
media = []

[dependencies]
async-compression.workspace = true
chromiumoxide = { workspace = true, optional = true }
askama.workspace = true
schemars.workspace = true
async-channel.workspace = true
futures.workspace = true
quick-xml.workspace = true
regex.workspace = true
reqwest.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
texting_robots.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
url.workspace = true

[dev-dependencies]
insta.workspace = true
jsonschema.workspace = true
tokio = { workspace = true, features = ["io-util"] }
wiremock.workspace = true

[lints]
workspace = true

[[example]]
name = "spawn-futures"
path = "../../examples/spawn-futures.rs"

[[example]]
name = "custom-rule"
path = "../../examples/custom-rule.rs"
