# M0 de-risk spikes. Removed together with spikes/ once M0 is signed off.
name: m0-spikes

on:
  push:
    paths: ["spikes/**", ".github/workflows/m0-spikes.yml"]
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: spikes

jobs:
  spikes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes
      - name: Chrome version
        run: |
          case "$RUNNER_OS" in
            Linux) google-chrome --version ;;
            macOS) "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version ;;
            Windows) powershell -c "(Get-Item 'C:\Program Files\Google\Chrome\Application\chrome.exe').VersionInfo.ProductVersion" ;;
          esac
      - run: ./fetch-axe.sh
      - run: cargo build --release --bins
      - name: browser spike (hard kill, the cancel policy)
        run: cargo run --release --bin browser
      - name: browser spike (polite close, for comparison)
        if: always()
        continue-on-error: true
        run: SPIKE_POLITE_CLOSE=1 cargo run --release --bin browser
      - name: spawn spike
        if: always()
        run: cargo run --release --bin spawn
      - name: memory spike
        if: always()
        run: cargo run --release --bin memory -- 1000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: spikes/out/*.png

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: ./fetch-axe.sh
      - run: cargo build --release --bins --target x86_64-unknown-linux-musl
      - run: file target/x86_64-unknown-linux-musl/release/browser
      - name: browser spike from the musl binary
        run: ./target/x86_64-unknown-linux-musl/release/browser
