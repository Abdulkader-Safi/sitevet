# M0 throwaway spike. Deleted or moved into crates/ once M0 is signed off.
[package]
name = "sitevet-spikes"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = "0.7"
async-channel = "2.5"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "zstd", "http2"] }
scraper = { version = "0.29", default-features = false }
chromiumoxide = { version = "0.9", default-features = false }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
